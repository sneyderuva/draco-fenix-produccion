name: Desplegar en el VPS

# Cada cambio en main se copia al VPS y la app se reconstruye allí.
# Requiere los secretos VPS_HOST, VPS_USER, VPS_SSH_KEY y APP_PASSWORD (ver README).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      RUTA: ${{ vars.VPS_RUTA || 'draco' }}
      PUERTO: ${{ vars.APP_PUERTO || '3000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          faltan=""
          for s in VPS_HOST VPS_USER VPS_SSH_KEY APP_PASSWORD; do
            [ -n "${!s}" ] || faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos del repositorio:$faltan. Ver la sección Despliegue del README."
            exit 1
          fi
          if [ "${#APP_PASSWORD}" -lt 8 ]; then
            echo "::error::APP_PASSWORD debe tener al menos 8 caracteres."
            exit 1
          fi

      - name: Preparar la conexión
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/vps
            IdentitiesOnly yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Copiar el código y los datos
        run: |
          ssh vps "mkdir -p '$RUTA'"
          rsync -az --delete \
            --exclude .git --exclude .github \
            --exclude .env --exclude .env.app --exclude .session_secret \
            ./ "vps:$RUTA/"

      - name: Entregar la contraseña de la app
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          umask 077
          printf 'APP_PASSWORD=%s\n' "$APP_PASSWORD" > "$RUNNER_TEMP/env.app"
          scp -q "$RUNNER_TEMP/env.app" "vps:$RUTA/.env.app"
          rm -f "$RUNNER_TEMP/env.app"

      - name: Levantar la app
        run: |
          ssh vps "RUTA='$RUTA' PUERTO='$PUERTO' bash -s" <<'REMOTO'
          set -euo pipefail
          cd "$RUTA"
          umask 077
          [ -s .session_secret ] || openssl rand -hex 32 > .session_secret
          {
            cat .env.app
            echo "SESSION_SECRET=$(cat .session_secret)"
            echo "PUERTO=$PUERTO"
            echo "COOKIE_SECURE=0"
          } > .env
          rm -f .env.app
          docker compose up -d --build
          docker compose ps
          REMOTO
